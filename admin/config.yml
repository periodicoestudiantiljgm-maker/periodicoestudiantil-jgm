backend:
  name: git-gateway
  repo: periodicoestudiantiljgm-maker/periodicoestudiantil-jgm
  branch: main

locale: "es"

# Carpeta central para todas las imágenes y arte que subas
media_folder: "contenido/imagenes"
public_folder: "/contenido/imagenes"

collections:
  - name: "articulos"
    label: "📰 Redacción de Artículos"
    label_singular: "Artículo"
    folder: "contenido/articulos"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "[{{seccion}}] {{title}} - {{autor}}" 
    fields:
      - { label: "Título Principal", name: "title", widget: "string" }
      - { label: "Bajada o Epígrafe (Breve resumen)", name: "bajada", widget: "text", required: false }
      
      # Menú de secciones cerrado (Opciones estrictas, adiós a errores)
      - label: "Sección Editorial"
        name: "seccion"
        widget: "select"
        options: 
          - "Arte, Ilustración & Fotografía"
          - "Cartas al Director"
          - "Crónicas & Reportajes"
          - "Cuentos & Narrativa"
          - "Ensayos & Opinión"
          - "Entrevistas"
          - "Filosofía & Crítica"
          - "Poesía"
          - "Reseñas (Cine, Lit, Arte)"
          - "Música & Escena Local"
          - "Sátira & Humor"
          
      - { label: "Autor o Seudónimo", name: "autor", widget: "string", default: "Anónimo" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime" }
      
      # Herramientas avanzadas
      - { label: "🔥 Artículo Destacado (Fijar en Portada)", name: "destacado", widget: "boolean", default: false }
      
      # Módulo de Imagen Destacada (Para subir fotos o ilustraciones)
      - label: "Imagen Destacada (Arte/Foto)"
        name: "thumbnail"
        widget: "object"
        required: false
        fields:
          - { label: "Subir Imagen", name: "image", widget: "image" }
          - { label: "Pie de foto (Créditos)", name: "caption", widget: "string", required: false }
          - { label: "Texto Alternativo", name: "alt", widget: "string", default: "Imagen destacada del artículo" }
          
      # El lienzo de escritura principal
      - { label: "Cuerpo del Artículo", name: "body", widget: "markdown" }
